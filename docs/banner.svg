  <circle cx="1010" cy="208" r="126" fill="none" stroke="#789688" stroke-opacity=".24"/>
  <circle cx="1010" cy="208" r="98" fill="none" stroke="#789688" stroke-opacity=".16" stroke-dasharray="5 8"/>
  <path d="M970 171L1070 208L970 245Z" fill="#d2aa66" opacity=".88"/>
  <text x="78" y="128" fill="#f1eadc" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700" letter-spacing="5">学习页面播放助手</text>
  <text x="82" y="178" fill="#9eb4a8" font-family="Microsoft YaHei, sans-serif" font-size="23">播放状态检测 · iframe 诊断 · 配置化原型</text>
  <path d="M82 238H650" stroke="url(#line)" stroke-width="2"/>
  <g fill="#b7c8be" font-family="Microsoft YaHei, sans-serif" font-size="18">
    <circle cx="90" cy="286" r="5" fill="#d2aa66"/>
