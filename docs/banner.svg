<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">学习页面播放助手</title>
  <desc id="desc">深青色背景上的播放进度、页面结构和诊断节点示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102923"/>
      <stop offset="1" stop-color="#07130f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c29c5d"/>
      <stop offset="1" stop-color="#668477"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <g opacity=".18" stroke="#9bb5a7">
    <path d="M0 80H1280M0 180H1280M0 280H1280M0 380H1280"/>
    <path d="M200 0V420M500 0V420M800 0V420M1100 0V420"/>
